[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fibrechain"
version = "1.1.0"
description = "Lenslet-to-detector throughput of a fibre-fed spectrograph: fibre angular distribution x independent real ray trace of the OpticStudio prescription"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Pichon", email = "thomas.pichon@lam.fr" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
figures = ["SciencePlots>=2.1"]

[project.scripts]
fibrechain = "fibrechain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
